:root{
  --paper:#F6F8FB; --surface:#FFFFFF; --surface-2:#FBFCFE;
  --ink:#14202C; --ink-soft:#57657A; --ink-faint:#8D9AAC;
  --line:#E5EAF1; --line-strong:#CFD8E4;
  --accent:#0E7C86; --accent-deep:#0A5B63; --accent-wash:#E4F1F2; --accent-line:#B9DEE0;
  --ok:#157F5B; --ok-wash:#E3F3EC; --ok-line:#B8E0CD;
  --ko:#C2483D; --ko-wash:#FBEAE7; --ko-line:#F0C6C0;
  --warn:#B7791F; --warn-wash:#FBF1DF;
  --exam:#132132; --exam-2:#1B2D42; --exam-line:#2C3F58; --exam-ink:#E8EEF6; --exam-soft:#93A6C0;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(20,32,44,.04), 0 8px 24px -18px rgba(20,32,44,.28);
  --mono:"Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
  --sans:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
/* ---------- theme sombre (global) ---------- */
[data-theme="dark"]{
  --paper:#0E1621; --surface:#152230; --surface-2:#1A2836;
  --ink:#E7EEF6; --ink-soft:#A7B6C7; --ink-faint:#6E8098;
  --line:#25333F; --line-strong:#31404E;
  --accent:#3BB4BF; --accent-deep:#63C6CF; --accent-wash:#13323A; --accent-line:#245660;
  --ok:#4BB98A; --ok-wash:#12362A; --ok-line:#215842;
  --ko:#E5776B; --ko-wash:#3A211E; --ko-line:#5E322D;
  --warn:#D9A441; --warn-wash:#332813;
  --exam:#060C13; --exam-2:#0E1A28; --exam-line:#233648; --exam-ink:#EAF1FA; --exam-soft:#8398B2;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.7);
}
[data-theme="dark"] .conc-hud .btn.primary{background:#1E8A96; border-color:#1E8A96}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
button{font-family:inherit}
::selection{background:var(--accent-wash)}

.root{max-width:940px; margin:0 auto; padding:0 18px 96px}

/* ---------- barre du haut ---------- */
.top{
  position:sticky; top:0; z-index:30; background:rgba(246,248,251,.86);
  backdrop-filter:saturate(1.2) blur(10px);
  display:flex; align-items:center; gap:14px;
  padding:16px 2px 14px; margin-bottom:6px; border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.brand-mark{
  font-weight:800; font-size:1.02rem; letter-spacing:.02em; color:#fff;
  background:var(--accent); border-radius:8px; padding:3px 8px; line-height:1;
}
.brand-name{font-weight:700; font-size:1.06rem; letter-spacing:-.01em; white-space:nowrap}
.brand-sub{color:var(--ink-faint); font-size:.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.top-actions{display:flex; align-items:center; gap:8px}
.icon-btn{
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft);
  height:34px; min-width:34px; padding:0 9px; border-radius:9px; font-size:.86rem; font-weight:600;
  cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.14s;
}
.icon-btn:hover{border-color:var(--accent-line); color:var(--accent-deep); background:var(--accent-wash)}
.icon-btn.kbd{font-family:var(--mono); letter-spacing:.03em}

/* ---------- boutons ---------- */
.btn{
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  padding:9px 15px; border-radius:10px; font-size:.92rem; font-weight:600; cursor:pointer;
  transition:.14s; display:inline-flex; align-items:center; gap:7px; line-height:1.1;
}
.btn:hover:not(:disabled){border-color:var(--accent-line); background:var(--accent-wash); color:var(--accent-deep)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-deep); border-color:var(--accent-deep); color:#fff}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft)}
.btn.ghost:hover:not(:disabled){background:var(--accent-wash); color:var(--accent-deep)}
.btn.danger:hover:not(:disabled){border-color:var(--ko-line); background:var(--ko-wash); color:var(--ko)}
.btn.sm{padding:6px 11px; font-size:.84rem; border-radius:8px}
.btn.big{padding:12px 20px; font-size:1rem}

/* ---------- banni\xE8res ---------- */
.banner{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:13px 16px; border-radius:var(--radius); margin:12px 0;
  border:1px solid var(--line); background:var(--surface);
}
.banner .banner-txt{flex:1; min-width:220px; font-size:.92rem; color:var(--ink-soft)}
.banner .banner-txt b{color:var(--ink)}
.banner.reprise{border-color:var(--accent-line); background:linear-gradient(180deg,var(--accent-wash),var(--surface))}
.banner.tri{border-color:var(--warn-wash); background:var(--warn-wash)}
.banner.warn{border-color:var(--ko-line); background:var(--ko-wash)}
.banner.warn b{color:var(--ko)}
.banner.flash{border-color:var(--ok-line); background:var(--ok-wash); color:var(--ok); font-weight:600; justify-content:center}

/* ---------- accueil : filtres ---------- */
.home-head{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin:20px 0 8px; flex-wrap:wrap}
.home-title{font-size:1.5rem; font-weight:800; letter-spacing:-.02em; margin:0}
.home-count{color:var(--ink-faint); font-size:.9rem; font-weight:600}
.controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:9px; overflow:hidden; background:var(--surface)}
.seg button{border:0; background:transparent; color:var(--ink-soft); padding:7px 12px; font-size:.85rem; font-weight:600; cursor:pointer; border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent); color:#fff}
.selectlike{position:relative}
.selectlike select{
  appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  padding:7px 30px 7px 12px; border-radius:9px; font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit;
}
.selectlike::after{content:"\u25BE"; position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none; font-size:.7rem}

/* ---------- groupes UE + s\xE9ries ---------- */
.ue-group{margin:22px 0}
.ue-head{
  display:flex; align-items:center; gap:10px; padding:0 2px 8px; cursor:pointer; user-select:none;
  border-bottom:1px solid var(--line);
}
.ue-caret{color:var(--ink-faint); font-size:.7rem; transition:transform .15s; width:12px}
.ue-caret.open{transform:rotate(90deg)}
.ue-name{font-weight:700; font-size:1.02rem; letter-spacing:-.01em}
.ue-meta{color:var(--ink-faint); font-size:.82rem; font-weight:600; margin-left:auto}

.series-list{display:flex; flex-direction:column; gap:0}
.serie-row{
  position:relative; display:flex; align-items:center; gap:14px; padding:14px 16px 14px 15px;
  border:1px solid var(--line); border-top:0; background:var(--surface); cursor:pointer; transition:.13s;
}
.serie-row:first-child{border-top:1px solid var(--line); border-radius:var(--radius) var(--radius) 0 0}
.serie-row:last-child{border-radius:0 0 var(--radius) var(--radius)}
.serie-row:only-child{border-radius:var(--radius)}
.serie-row:hover{background:var(--surface-2); z-index:1}
.serie-row::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent; border-radius:3px 0 0 3px}
.serie-row.lvl-low::before{background:var(--ko)}
.serie-row.lvl-mid::before{background:var(--warn)}
.serie-row.lvl-ok::before{background:var(--ok)}
.serie-row.lvl-todo::before{background:var(--accent)}
.serie-main{min-width:0; flex:1}
.serie-chap{font-weight:650; font-size:1rem; letter-spacing:-.01em; margin:0 0 3px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.serie-reason{font-size:.83rem; color:var(--ink-soft)}
.serie-right{display:flex; align-items:center; gap:12px; flex-shrink:0}
.serie-nqcm{font-size:.82rem; color:var(--ink-faint); font-weight:600; white-space:nowrap}
.serie-del{
  border:0; background:transparent; color:var(--ink-faint); font-size:1.15rem; line-height:1; cursor:pointer;
  width:30px; height:30px; border-radius:7px; opacity:.5; transition:.13s; flex-shrink:0;
}
.serie-row:hover .serie-del{opacity:1}
.serie-del:hover{background:var(--ko-wash); color:var(--ko)}

.score-chip{
  font-size:.8rem; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;
  border:1px solid var(--line-strong); color:var(--ink-soft); background:var(--surface-2);
}
.score-chip.good{color:var(--ok); background:var(--ok-wash); border-color:var(--ok-line)}
.score-chip.mid{color:var(--warn); background:var(--warn-wash); border-color:transparent}
.score-chip.low{color:var(--ko); background:var(--ko-wash); border-color:var(--ko-line)}
.diff-chip{
  font-size:.66rem; font-weight:700; letter-spacing:.04em; padding:2px 7px; border-radius:5px;
  background:var(--surface-2); color:var(--ink-faint); border:1px solid var(--line)
}
.diff-chip.concours{color:var(--accent-deep); background:var(--accent-wash); border-color:var(--accent-line)}
.diff-chip.difficile{color:var(--ko); background:var(--ko-wash); border-color:var(--ko-line)}
.diff-chip.facile{color:var(--ok); background:var(--ok-wash); border-color:var(--ok-line)}

/* ---------- \xE9tat vide ---------- */
.empty{
  text-align:center; padding:56px 20px; border:1px dashed var(--line-strong); border-radius:var(--radius);
  background:var(--surface); margin-top:18px;
}
.empty h2{font-size:1.3rem; font-weight:800; letter-spacing:-.02em; margin:0 0 8px}
.empty p{color:var(--ink-soft); max-width:460px; margin:0 auto 18px}
.empty-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}

/* ---------- vue s\xE9rie ---------- */
.serie-view{margin-top:8px}
.crumb{display:flex; align-items:center; gap:8px; color:var(--ink-faint); font-size:.85rem; font-weight:600; margin:14px 0 6px}
.crumb a{color:var(--accent-deep); cursor:pointer; text-decoration:none}
.crumb a:hover{text-decoration:underline}
.sv-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px}
.sv-title{font-size:1.5rem; font-weight:800; letter-spacing:-.02em; margin:0; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.sv-score{display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--ink-soft); margin-top:6px}
.sv-score b{color:var(--ink); font-weight:700}
.sv-score .dot{color:var(--ink-faint)}
.sv-actions{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 18px}

/* ---------- carte QCM ---------- */
.list{display:flex; flex-direction:column; gap:14px}
.card{
  position:relative; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);
  padding:18px 18px 16px; box-shadow:var(--shadow);
}
.card.done{background:var(--surface-2)}
.card-x{position:absolute; top:10px; right:10px; border:0; background:transparent; color:var(--ink-faint); font-size:1.2rem; line-height:1; width:30px; height:30px; border-radius:7px; cursor:pointer; opacity:.5; transition:.12s}
.card:hover .card-x{opacity:1}
.card-x:hover{background:var(--ko-wash); color:var(--ko)}
.q-head{font-weight:600; font-size:1.02rem; line-height:1.4; margin-bottom:14px; padding-right:20px}
.q-num{display:inline-block; font-size:.74rem; font-weight:700; color:var(--accent-deep); background:var(--accent-wash); border:1px solid var(--accent-line); padding:2px 7px; border-radius:6px; margin-right:8px; vertical-align:2px}
.props{display:flex; flex-direction:column; gap:8px}
.prop{
  display:grid; grid-template-columns:auto 1fr auto; align-items:start; gap:10px;
  padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface);
}
.card.done .prop{background:#fff}
.prop.ok{border-color:var(--ok-line); background:var(--ok-wash)}
.prop.ko{border-color:var(--ko-line); background:var(--ko-wash)}
.prop.blank-prop{border-style:dashed}
.prop-let{font-weight:700; color:var(--ink-soft); width:1.3em; text-align:center; padding-top:1px}
.prop-txt{font-size:.95rem; line-height:1.42; align-self:center}
.vf{display:inline-flex; gap:5px; align-self:center}
.vf-btn{
  width:34px; height:34px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft);
  border-radius:8px; font-weight:800; font-size:.9rem; cursor:pointer; transition:.12s;
}
.vf-btn:hover{border-color:var(--accent-line)}
.vf-btn.on.v{background:var(--ok); border-color:var(--ok); color:#fff}
.vf-btn.on.f{background:var(--ko); border-color:var(--ko); color:#fff}
.verdict{display:inline-flex; align-items:center; gap:7px; align-self:center; flex-wrap:wrap}
.res{font-size:.72rem; font-weight:800; letter-spacing:.02em; padding:3px 8px; border-radius:6px; white-space:nowrap}
.res.ok{background:var(--ok-wash); color:var(--ok); border:1px solid var(--ok-line)}
.res.ko{background:var(--ko-wash); color:var(--ko); border:1px solid var(--ko-line)}
.res.na{background:var(--surface-2); color:var(--ink-faint); border:1px solid var(--line)}
.truth{font-size:.72rem; font-weight:600; letter-spacing:.01em; padding:3px 8px; border-radius:6px; color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--line); white-space:nowrap}
.cat{font-size:.72rem; font-weight:700; color:var(--warn); background:var(--warn-wash); padding:2px 7px; border-radius:5px}
.just{grid-column:2 / -1; margin:6px 0 0; font-size:.87rem; color:var(--ink-soft); line-height:1.45}
.prop-piege{grid-column:2 / -1; margin:5px 0 0; font-size:.85rem; color:var(--warn)}
.pp-lab{font-weight:700}
.q-foot{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap}
.q-detail{margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:.9rem; color:var(--ink-soft)}
.q-detail p{margin:0 0 6px}
.q-pieges,.q-piege-detail{margin-top:10px; font-size:.85rem; color:var(--ink-soft)}
.q-pieges-lab{font-weight:700; color:var(--ink)}
.actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}

/* garde-fou s\xE9rie corrig\xE9e */
.gate{border:1px solid var(--accent-line); background:var(--accent-wash); border-radius:var(--radius); padding:22px; text-align:center; margin-top:6px}
.gate p{color:var(--ink-soft); max-width:440px; margin:0 auto 16px}
.gate-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}

/* historique tentatives */
.attempts{margin-top:22px; padding-top:16px; border-top:1px solid var(--line)}
.attempts-h{font-size:.8rem; font-weight:700; color:var(--ink-faint); margin:0 0 10px}
.attempt-chips{display:flex; gap:7px; flex-wrap:wrap}
.attempt-chip{font-size:.8rem; padding:4px 9px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft)}
.attempt-chip b{color:var(--ink)}
.attempt-chip.good b{color:var(--ok)} .attempt-chip.mid b{color:var(--warn)} .attempt-chip.low b{color:var(--ko)}

/* ---------- mode concours (surface sombre) ---------- */
.conc-hud{
  position:sticky; top:64px; z-index:20; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  background:var(--exam); color:var(--exam-ink); border:1px solid var(--exam-line);
  border-radius:var(--radius); padding:12px 16px; margin-bottom:16px; box-shadow:var(--shadow);
}
.conc-clock{font-size:1.5rem; font-weight:800; letter-spacing:.01em; min-width:78px}
.conc-clock.warn{color:#FF9F7A}
.conc-clock.danger{color:#FF6B5A; animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.conc-prog-wrap{flex:1; min-width:180px}
.conc-prog{height:7px; border-radius:5px; background:var(--exam-line); overflow:hidden; margin-bottom:5px}
.conc-prog span{display:block; height:100%; background:linear-gradient(90deg,#3BB2BE,#5CD1DA); border-radius:5px; transition:width .3s}
.conc-hud .dim{color:var(--exam-soft); font-size:.78rem}
.conc-hud .btn.primary{background:#2AA5B1; border-color:#2AA5B1}
.conc-hud .btn.primary:hover{background:#33B7C4; border-color:#33B7C4}

/* r\xE9sultat concours */
.conc-result{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); padding:24px; box-shadow:var(--shadow)}
.conc-note{text-align:center; padding:8px 0 18px}
.conc-note-big{font-size:3.4rem; font-weight:800; letter-spacing:-.03em; line-height:1}
.conc-note.good .conc-note-big{color:var(--ok)} .conc-note.mid .conc-note-big{color:var(--warn)} .conc-note.low .conc-note-big{color:var(--ko)}
.conc-note-max{font-size:1.4rem; color:var(--ink-faint); font-weight:700}
.conc-note-sub{display:block; color:var(--ink-soft); font-size:.9rem; margin-top:6px; font-weight:600}
.conc-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px}
.conc-stat{border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface-2); padding:12px; text-align:center}
.conc-stat b{display:block; font-size:1.4rem; font-weight:800; margin-bottom:2px}
.conc-stat span{font-size:.78rem; color:var(--ink-soft); line-height:1.3}
.conc-disc{display:flex; flex-direction:column; gap:7px; margin-bottom:14px}
.conc-disc-row{display:grid; grid-template-columns:110px 1fr 28px; align-items:center; gap:10px; font-size:.82rem}
.conc-disc-lab{color:var(--ink-soft); font-weight:600}
.conc-disc-bar{height:8px; background:var(--line); border-radius:5px; overflow:hidden}
.conc-disc-bar span{display:block; height:100%; border-radius:5px}
.conc-disc-row.d0 .conc-disc-bar span{background:var(--ok)}
.conc-disc-row.d1 .conc-disc-bar span{background:#7FB53E}
.conc-disc-row.d2 .conc-disc-bar span{background:var(--warn)}
.conc-disc-row.d3 .conc-disc-bar span{background:var(--ko)}
.conc-disc-cnt{text-align:right; font-weight:700; color:var(--ink-soft)}
.conc-result-btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:18px 0 6px}
.conc-corr-h{font-size:1rem; font-weight:700; margin:22px 0 12px; padding-top:16px; border-top:1px solid var(--line)}
.hint{font-size:.85rem; color:var(--ink-soft); line-height:1.5}

/* r\xE9glage concours */
.setup-box{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); padding:20px; margin-bottom:16px; box-shadow:var(--shadow)}
.setup-box h3{margin:0 0 4px; font-size:1.1rem; font-weight:800; letter-spacing:-.01em}
.setup-box .sub{color:var(--ink-soft); font-size:.9rem; margin:0 0 16px}
.field{display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap}
.field label{font-size:.9rem; font-weight:600; min-width:130px}
.field input[type=number]{width:88px; padding:8px 10px; border:1px solid var(--line-strong); border-radius:8px; font-family:inherit; font-size:.92rem}
.field .unit{color:var(--ink-faint); font-size:.85rem}
.toggle{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:.9rem; font-weight:600}
.bareme-grid{display:flex; gap:14px; flex-wrap:wrap; margin:6px 0 4px}
.bareme-cell{display:flex; flex-direction:column; gap:4px}
.bareme-cell span{font-size:.76rem; color:var(--ink-soft); font-weight:600}
.bareme-cell input{width:72px; padding:7px 9px; border:1px solid var(--line-strong); border-radius:8px; font-family:inherit}

/* ---------- reprise (overlay centr\xE9) ---------- */
.overlay{position:fixed; inset:0; z-index:60; background:rgba(19,33,50,.55); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:18px}
.reprise-card{width:100%; max-width:560px; background:var(--surface); border-radius:18px; box-shadow:0 30px 80px -30px rgba(0,0,0,.5); overflow:hidden}
.reprise-top{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line)}
.reprise-prog{font-weight:700; font-size:.9rem; color:var(--accent-deep)}
.reprise-body{padding:22px 22px 8px}
.reprise-ctx{font-size:.78rem; color:var(--ink-faint); font-weight:600; margin-bottom:8px}
.reprise-enonce{font-weight:600; font-size:1.02rem; margin-bottom:14px; line-height:1.4}
.reprise-prop{border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:14px; font-size:1rem; line-height:1.45; margin-bottom:16px; background:var(--surface-2)}
.reprise-prop.ok{border-color:var(--ok-line); background:var(--ok-wash)}
.reprise-prop.ko{border-color:var(--ko-line); background:var(--ko-wash)}
.reprise-vf{display:flex; gap:10px; justify-content:center; margin-bottom:8px}
.reprise-vf .big-vf{flex:1; max-width:160px; padding:16px; font-size:1.05rem; font-weight:800; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); cursor:pointer; transition:.12s}
.reprise-vf .big-vf.v:hover{border-color:var(--ok-line); background:var(--ok-wash); color:var(--ok)}
.reprise-vf .big-vf.f:hover{border-color:var(--ko-line); background:var(--ko-wash); color:var(--ko)}
.reprise-feedback{text-align:center; padding:6px 0 16px}
.reprise-verdict{font-weight:800; font-size:1.05rem}
.reprise-verdict.ok{color:var(--ok)} .reprise-verdict.ko{color:var(--ko)}
.reprise-just{font-size:.88rem; color:var(--ink-soft); margin-top:6px; line-height:1.45}
.reprise-box-dots{display:inline-flex; gap:4px; margin-left:8px; vertical-align:middle}
.reprise-box-dots i{width:8px; height:8px; border-radius:50%; background:var(--line-strong); display:inline-block}
.reprise-box-dots i.on{background:var(--accent)}
.reprise-foot{display:flex; justify-content:center; padding:0 22px 20px}
.reprise-nextbtn{min-width:150px; justify-content:center}
.reprise-done{text-align:center; padding:30px 24px}
.reprise-done h3{font-size:1.3rem; font-weight:800; margin:0 0 12px}
.reprise-done-stats{display:flex; gap:20px; justify-content:center; margin:16px 0 22px}
.reprise-done-stats b{display:block; font-size:1.6rem; font-weight:800}
.reprise-done-stats span{font-size:.82rem; color:var(--ink-soft)}

/* ---------- modales g\xE9n\xE9riques ---------- */
.modal-back{position:fixed; inset:0; z-index:70; background:rgba(19,33,50,.5); backdrop-filter:blur(3px); display:flex; align-items:flex-start; justify-content:center; padding:40px 18px; overflow:auto}
.modal{width:100%; max-width:600px; background:var(--surface); border-radius:16px; box-shadow:0 30px 80px -30px rgba(0,0,0,.5); overflow:hidden}
.modal.wide{max-width:720px}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line)}
.modal-head h3{margin:0; font-size:1.15rem; font-weight:800; letter-spacing:-.01em}
.modal-x{border:0; background:transparent; font-size:1.5rem; line-height:1; color:var(--ink-faint); cursor:pointer; width:32px; height:32px; border-radius:8px}
.modal-x:hover{background:var(--line); color:var(--ink)}
.modal-body{padding:22px}
.modal-body p{color:var(--ink-soft); font-size:.92rem}
.modal-foot{display:flex; gap:10px; justify-content:flex-end; padding:16px 22px; border-top:1px solid var(--line); flex-wrap:wrap}
textarea.paste{width:100%; min-height:180px; border:1px solid var(--line-strong); border-radius:10px; padding:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.82rem; line-height:1.5; resize:vertical}
.field-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.field-row .col{flex:1; min-width:160px}
.field-row label{display:block; font-size:.8rem; font-weight:700; color:var(--ink-soft); margin-bottom:5px}
.field-row input,.field-row select{width:100%; padding:9px 11px; border:1px solid var(--line-strong); border-radius:8px; font-family:inherit; font-size:.92rem}
.dropzone{border:2px dashed var(--line-strong); border-radius:12px; padding:24px; text-align:center; color:var(--ink-soft); cursor:pointer; transition:.14s; background:var(--surface-2)}
.dropzone:hover{border-color:var(--accent-line); background:var(--accent-wash); color:var(--accent-deep)}
.import-preview{border:1px solid var(--ok-line); background:var(--ok-wash); border-radius:10px; padding:12px 14px; font-size:.9rem; color:var(--ink); margin-top:12px}
.import-preview b{color:var(--ok)}
.import-err{border:1px solid var(--ko-line); background:var(--ko-wash); border-radius:10px; padding:12px 14px; font-size:.9rem; color:var(--ko); margin-top:12px}
.help-body h4{font-size:.98rem; font-weight:700; margin:18px 0 6px} .help-body h4:first-child{margin-top:0}
.help-body p{margin:0 0 8px; line-height:1.55}
.help-body code{background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:1px 5px; font-size:.82rem}
.help-body pre{background:var(--exam); color:var(--exam-ink); border-radius:10px; padding:14px; overflow:auto; font-size:.78rem; line-height:1.5}

/* palette \u2318K */
.palette{width:100%; max-width:560px; background:var(--surface); border-radius:14px; box-shadow:0 30px 80px -20px rgba(0,0,0,.5); overflow:hidden; margin-top:6vh}
.palette input{width:100%; border:0; border-bottom:1px solid var(--line); padding:16px 20px; font-size:1rem; font-family:inherit; outline:none}
.palette-list{max-height:56vh; overflow:auto; padding:6px}
.palette-item{display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:9px; cursor:pointer; font-size:.92rem}
.palette-item.sel{background:var(--accent-wash)}
.palette-item .p-hint{margin-left:auto; font-size:.78rem; color:var(--ink-faint)}
.palette-empty{padding:20px; text-align:center; color:var(--ink-faint); font-size:.9rem}

.snap-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--line)}
.snap-row:last-child{border-bottom:0}
.snap-day{font-weight:600} .snap-meta{font-size:.82rem; color:var(--ink-faint)}

.tri-list{max-height:44vh; overflow:auto; margin:6px 0}
.tri-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:.88rem; align-items:flex-start}
.tri-item input{margin-top:3px}
.tri-item .tri-nat{font-size:.7rem; font-weight:700; padding:1px 6px; border-radius:5px; background:var(--warn-wash); color:var(--warn); flex-shrink:0; margin-top:1px}

@media (max-width:600px){
  .root{padding:0 12px 90px}
  .brand-sub{display:none}
  .conc-stats{grid-template-columns:1fr 1fr}
  .conc-note-big{font-size:2.8rem}
  .home-title{font-size:1.3rem}
  .sv-title{font-size:1.25rem}
  .prop{grid-template-columns:auto 1fr; grid-template-areas:"let txt" "vf vf"}
  .prop .vf,.prop .verdict{justify-self:start; grid-column:1 / -1}
}
.mini-select{appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); padding:8px 10px; border-radius:8px; font-size:.82rem; font-weight:600; cursor:pointer}
/* ---------- accessibilite : focus clavier visible ---------- */
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- combobox (saisie + suggestions, fiable sur iPad) ---------- */
.combo{position:relative}
.combo-pop{position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:60; background:var(--surface); border:1px solid var(--line-strong); border-radius:10px; box-shadow:var(--shadow); max-height:210px; overflow:auto}
.combo-item{padding:10px 12px; cursor:pointer; font-size:.9rem; border-bottom:1px solid var(--line)}
.combo-item:last-child{border-bottom:0}
.combo-item:hover,.combo-item.sel{background:var(--accent-wash); color:var(--accent-deep)}

/* ---------- menu "..." (actions secondaires) ---------- */
.menu{position:relative; display:inline-block}
.menu-pop{position:absolute; right:0; top:calc(100% + 6px); z-index:60; background:var(--surface); border:1px solid var(--line-strong); border-radius:11px; box-shadow:var(--shadow); min-width:210px; overflow:hidden; padding:5px}
.menu-item{display:block; width:100%; text-align:left; border:0; background:transparent; color:var(--ink); padding:10px 12px; font-size:.9rem; font-weight:600; border-radius:8px; cursor:pointer}
.menu-item:hover{background:var(--accent-wash); color:var(--accent-deep)}
.menu-item.danger{color:var(--ko)} .menu-item.danger:hover{background:var(--ko-wash)}

/* ---------- snackbar (suppression + annuler) ---------- */
.snackbar{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:80; display:flex; align-items:center; gap:14px;
  background:var(--ink); color:var(--surface); padding:11px 16px; border-radius:12px; box-shadow:var(--shadow); font-size:.9rem; max-width:calc(100vw - 32px)}
[data-theme="dark"] .snackbar{background:#26384A; color:var(--ink)}
.snackbar button{border:0; background:transparent; color:var(--accent-deep); font-weight:800; cursor:pointer; font-size:.9rem}
[data-theme="dark"] .snackbar button{color:var(--accent)}

/* ---------- pied de version ---------- */
.build-tag{margin:34px auto 0; text-align:center; color:var(--ink-faint); font-size:.72rem}

/* ---------- cibles tactiles agrandies (appareils sans survol) ---------- */
@media (hover:none),(pointer:coarse){
  .vf-btn{width:44px; height:44px; font-size:1rem}
  .card-x{width:40px; height:40px; opacity:.7; font-size:1.35rem}
  .serie-del{width:40px; height:40px; opacity:.7; font-size:1.3rem}
  .icon-btn{height:40px; min-width:40px}
  .modal-x{width:40px; height:40px}
  .combo-item{padding:12px 12px}
  .menu-item{padding:12px}
}
